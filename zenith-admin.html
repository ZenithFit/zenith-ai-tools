<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zenith HQ — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #F4F4F2;
    color: #111111;
    min-height: 100vh;
    padding: 36px 24px 60px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #00A86B;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  h1 span { color: #00A86B; }
  .sub { color: #6B706E; font-size: 15px; margin-top: 10px; margin-bottom: 36px; }
  h2 {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.01em;
    margin: 36px 0 14px;
  }
  .panel {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 10px 30px rgba(17, 17, 17, 0.06);
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #8A8F8D;
    margin: 16px 0 7px;
  }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid #E4E6E4;
    background: #FAFAF9;
    color: #111111;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { border-color: #00A86B; background: #FFFFFF; }
  .btn {
    padding: 13px 28px;
    border: none;
    border-radius: 999px;
    background: #00A86B;
    color: #FFFFFF;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 20px;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #008755; }
  .btn.small {
    padding: 8px 16px;
    font-size: 12px;
    margin: 0;
  }
  .btn.ghost {
    background: #FFFFFF;
    border: 1px solid #E4E6E4;
    color: #4A4F4D;
  }
  .btn.ghost:hover { border-color: #00A86B; color: #00A86B; background: #FFFFFF; }
  .msg {
    display: none;
    margin-top: 16px;
    padding: 12px 15px;
    border-radius: 12px;
    font-size: 14px;
  }
  .msg.bad { background: #FDF0EF; border: 1px solid #F3D2CE; color: #B3402F; }
  .msg.good { background: #EDF8F3; border: 1px solid #C4E8D8; color: #0B7A51; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8A8F8D;
    padding: 10px 8px;
    border-bottom: 1px solid #ECEDEB;
    font-weight: 700;
  }
  td { padding: 14px 8px; border-bottom: 1px solid #F1F2F0; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .inactive td { color: #B4B8B6; }
  .pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .pill.on { background: #EDF8F3; color: #0B7A51; }
  .pill.off { background: #FDF0EF; color: #B3402F; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none; }
  .tablewrap { overflow-x: auto; }
  .baseline {
    max-width: 880px;
    margin: 36px auto 0;
    height: 3px;
    background: #00A86B;
    border-radius: 999px;
    opacity: 0.9;
  }
  @media (max-width: 640px) {
    body { padding: 24px 16px 48px; }
    .panel { padding: 20px; }
    td, th { padding: 10px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Mark Only</div>
  <h1>Zenith <span>HQ</span> admin.</h1>
  <p class="sub">Your side of the house. Clients never see this page.</p>

  <!-- UNLOCK -->
  <div id="unlockPanel" class="panel">
    <label for="adminKey">Admin key</label>
    <input id="adminKey" type="password" autocomplete="off">
    <button class="btn" onclick="unlock()">Unlock</button>
    <div class="msg bad" id="unlockMsg"></div>
  </div>

  <!-- MAIN -->
  <div id="mainArea" class="hidden">

    <h2>Add a client.</h2>
    <div class="panel">
      <label for="newName">Full name, first and last (stamped on every Rate Your Day entry, e.g. Sarah Taylor)</label>
      <input id="newName" type="text" placeholder="First and last name, exactly as you want it in the Sheet">
      <label for="newUsername">Username (what they log in with, e.g. sarah.taylor)</label>
      <input id="newUsername" type="text" autocapitalize="none" autocorrect="off">
      <label for="newPassword">Password (8+ characters)</label>
      <input id="newPassword" type="text" autocomplete="off">
      <label for="newProgramme">Programme</label>
      <select id="newProgramme">
        <option>Accelerator</option>
        <option>Momentum</option>
        <option>Transformation</option>
      </select>
      <button class="btn" onclick="addClient()">Add client</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <h2>Clients.</h2>
    <div class="panel">
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Username</th><th>Programme</th><th>Status</th><th>Last login</th><th></th></tr>
          </thead>
          <tbody id="clientRows"></tbody>
        </table>
      </div>
      <div class="msg" id="listMsg"></div>
      <button class="btn ghost" onclick="loadClients()" style="margin-top:18px">Refresh list</button>
    </div>

  </div>
</div>
<div class="baseline"></div>

<script>
  const WORKER = 'https://zenith-fit.mark-5a5.workers.dev';

  function key() { return sessionStorage.getItem('zenith_admin_key') || ''; }

  function show(id, text, good) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + (good ? 'good' : 'bad');
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 5000);
  }

  async function api(path, method, body) {
    const res = await fetch(WORKER + path, {
      method: method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Key': key()
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function unlock() {
    sessionStorage.setItem('zenith_admin_key', document.getElementById('adminKey').value);
    try {
      await api('/admin/clients');
      document.getElementById('unlockPanel').classList.add('hidden');
      document.getElementById('mainArea').classList.remove('hidden');
      loadClients();
    } catch (e) {
      sessionStorage.removeItem('zenith_admin_key');
      show('unlockMsg', 'Wrong key. Try again.', false);
    }
  }

  document.getElementById('adminKey').addEventListener('keydown', e => {
    if (e.key === 'Enter') unlock();
  });

  function fmtDate(d) {
    if (!d) return 'Never';
    const date = new Date(d.replace(' ', 'T') + 'Z');
    return date.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  async function loadClients() {
    try {
      const clients = await api('/admin/clients');
      const rows = document.getElementById('clientRows');
      rows.innerHTML = '';
      if (!clients.length) {
        rows.innerHTML = '<tr><td colspan="6" style="color:#8A8F8D">No clients yet. Add your first one above.</td></tr>';
        return;
      }
      for (const c of clients) {
        const tr = document.createElement('tr');
        if (!c.active) tr.className = 'inactive';
        tr.innerHTML =
          '<td style="font-weight:700">' + esc(c.name) + '</td>' +
          '<td>' + esc(c.username) + '</td>' +
          '<td>' + esc(c.programme) + '</td>' +
          '<td><span class="pill ' + (c.active ? 'on">Active' : 'off">Off') + '</span></td>' +
          '<td>' + fmtDate(c.last_login) + '</td>' +
          '<td class="actions">' +
            (c.active
              ? '<button class="btn small ghost" onclick="deactivate(\'' + esc(c.username) + '\')">Deactivate</button>'
              : '<button class="btn small" onclick="reactivate(\'' + esc(c.username) + '\')">Reactivate</button>') +
            '<button class="btn small ghost" onclick="resetPassword(\'' + esc(c.username) + '\')">New password</button>' +
          '</td>';
        rows.appendChild(tr);
      }
    } catch (e) {
      show('listMsg', e.message, false);
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function addClient() {
    try {
      const fullName = document.getElementById('newName').value.trim().replace(/\s+/g, ' ');
      if (fullName.split(' ').filter(p => p.length >= 2).length < 2) {
        show('addMsg', 'Full name needed, first and last. This is what gets stamped on their Rate Your Day entries.', false);
        return;
      }
      const body = {
        name: fullName,
        username: document.getElementById('newUsername').value,
        password: document.getElementById('newPassword').value,
        programme: document.getElementById('newProgramme').value
      };
      await api('/admin/clients', 'POST', body);
      show('addMsg', 'Client added. Send them their username and password.', true);
      document.getElementById('newName').value = '';
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      loadClients();
    } catch (e) {
      show('addMsg', e.message, false);
    }
  }

  async function deactivate(username) {
    if (!confirm('Deactivate ' + username + '? They get logged out everywhere and cannot log back in. History is kept.')) return;
    try {
      await api('/admin/clients/deactivate', 'POST', { username });
      loadClients();
    } catch (e) { show('listMsg', e.message, false); }
  }

  async function reactivate(username) {
    try {
      await api('/admin/clients/reactivate', 'POST', { username });
      loadClients();
    } catch (e) { show('listMsg', e.message, false); }
  }

  async function resetPassword(username) {
    const pw = prompt('New password for ' + username + ' (8+ characters):');
    if (!pw) return;
    try {
      await api('/admin/clients/reset-password', 'POST', { username, password: pw });
      show('listMsg', 'Password changed for ' + username + '. They are logged out everywhere and need the new one.', true);
    } catch (e) { show('listMsg', e.message, false); }
  }
</script>
</body>
</html>
