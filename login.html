<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In | Zenith HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #1B2126;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #242B30;
    border: 1.5px solid #333C41;
    border-radius: 24px;
    padding: 44px 36px 36px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
  }
  .brand {
    margin-bottom: 36px;
  }
  .brand .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #3FD494;
    margin-bottom: 12px;
  }
  .brand h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: 0.01em;
    color: #FFFFFF;
  }
  .brand h1 span { color: #3FD494; }
  .brand p {
    color: #BFC6C3;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #BFC6C3;
    margin: 22px 0 8px;
  }
  input {
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    border: 1.5px solid #4C555B;
    background: #20272B;
    color: #FFFFFF;
    font-size: 16px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus { border-color: #3FD494; background: #20272B; }
  button {
    width: 100%;
    margin-top: 30px;
    padding: 17px;
    border: none;
    border-radius: 999px;
    background: #00A86B;
    color: #FFFFFF;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #008755; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    display: none;
    margin-top: 18px;
    padding: 13px 16px;
    border-radius: 14px;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.35);
    color: #FF9B93;
    font-size: 14px;
    text-align: center;
  }
  .help {
    margin-top: 26px;
    text-align: center;
    color: #BFC6C3;
    opacity: 0.8;
    font-size: 13px;
    line-height: 1.6;
  }
  .baseline {
    width: 100%;
    max-width: 420px;
    height: 3px;
    background: #3FD494;
    border-radius: 999px;
    margin-top: 28px;
    opacity: 0.9;
  }

  /* ===== HQ light theme (Oct 2026) ===== */
  body{font-family:'Inter Tight','DM Sans',sans-serif;background:radial-gradient(900px 420px at 100% -120px,rgba(63,212,148,.26),rgba(63,212,148,0) 62%) no-repeat,#F4F6F5!important;color:#111111!important}
  .card{background:#FFFFFF!important;border:1px solid #E3E7E5!important;box-shadow:0 14px 40px rgba(17,17,17,.07)!important}
  .brand .kicker{color:#7A7F7D!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;font-size:14px!important}
  .brand h1{font-family:'Roboto Slab',Georgia,serif!important;font-weight:800!important;color:#111111!important}
  .brand h1 span{color:#00A86B!important}
  .brand p,.help,.hint{color:#4A4F4D!important}
  label{color:#4A4F4D!important}
  input{background:#FFFFFF!important;border:1px solid #E3E7E5!important;color:#111111!important}
  input:focus{border-color:#00A86B!important;box-shadow:0 0 0 3px rgba(0,168,107,.12)!important}
  input::placeholder{color:#9AA19E!important}
  button{background:#00A86B!important;color:#FFFFFF!important}
  button:hover{background:#008755!important}
  button:disabled{background:#BFC6C3!important}
  .help a{color:#00A86B!important}
  .baseline{background:#00A86B!important}
  .bad{background:#FFFFFF!important;border-color:#E3E7E5!important;color:#4A4F4D!important}.bad b{color:#111111!important}
  .zc{background:#FFFFFF!important;border-color:#E3E7E5!important}.zc span{color:#4A4F4D!important}.zc a{color:#00A86B!important}
  .zc input{background:#FFFFFF!important;border:2px solid #B9BFBC!important;width:22px!important;padding:0!important}
  .zc input:checked{background:#00A86B!important;border-color:#00A86B!important}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="kicker">Members Only</div>
      <h1>Welcome to<br>Zenith <span>HQ.</span></h1>
      <p>Everything you need, in one place. Log in to get started.</p>
    </div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginBtn" type="submit">Log in</button>
    </form>

    <div class="error" id="errorBox"></div>

    <p class="help">Forgotten your login? Message Mark and he'll sort it.</p>
  </div>
  <div class="baseline"></div>

<script>
  const WORKER = 'https://zenith-fit.mark-5a5.workers.dev';

  function destination() {
    const params = new URLSearchParams(location.search);
    const n = params.get('next') || '';
    // Only ever send people to our own pages, never off site.
    return /^[a-z0-9-]+\.html([?#].*)?$/i.test(n) ? n : 'hq.html';
  }

  // Already logged in? Straight through.
  (async function () {
    const token = localStorage.getItem('zenith_token');
    if (!token) return;
    try {
      const res = await fetch(WORKER + '/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) {
        location.replace(destination());
      } else {
        localStorage.removeItem('zenith_token');
        localStorage.removeItem('zenith_name');
        localStorage.removeItem('zenith_programme');
      }
    } catch (e) { /* offline or worker down, stay on login */ }
  })();

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
      const res = await fetch(WORKER + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem('zenith_token', data.token);
        localStorage.setItem('zenith_name', data.name);
        localStorage.setItem('zenith_programme', data.programme);
        location.replace(destination());
      } else {
        errorBox.textContent = data.error || 'Something went wrong. Try again.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    } catch (err) {
      errorBox.textContent = 'Could not reach the server. Check your connection and try again.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
