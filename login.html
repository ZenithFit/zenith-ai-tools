<html lang="en">

<meta charset="UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #1B2126;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #242B30;
    border: 1.5px solid #333C41;
    border-radius: 24px;
    padding: 44px 36px 36px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
  }
  .brand {
    margin-bottom: 36px;
  }
  .brand .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #3FD494;
    margin-bottom: 12px;
  }
  .brand h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: 0.01em;
    color: #FFFFFF;
  }
  .brand h1 span { color: #3FD494; }
  .brand p {
    color: #BFC6C3;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #BFC6C3;
    margin: 22px 0 8px;
  }
  input {
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    border: 1.5px solid #4C555B;
    background: #20272B;
    color: #FFFFFF;
    font-size: 16px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus { border-color: #3FD494; background: #20272B; }
  button {
    width: 100%;
    margin-top: 30px;
    padding: 17px;
    border: none;
    border-radius: 999px;
    background: #00A86B;
    color: #FFFFFF;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #008755; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    display: none;
    margin-top: 18px;
    padding: 13px 16px;
    border-radius: 14px;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.35);
    color: #FF9B93;
    font-size: 14px;
    text-align: center;
  }
  .help {
    margin-top: 26px;
    text-align: center;
    color: #BFC6C3;
    opacity: 0.8;
    font-size: 13px;
    line-height: 1.6;
  }
  .baseline {
    width: 100%;
    max-width: 420px;
    height: 3px;
    background: #3FD494;
    border-radius: 999px;
    margin-top: 28px;
    opacity: 0.9;
  }

  /* ===== HQ light theme (Oct 2026) ===== */
  body{font-family:'Inter Tight','DM Sans',sans-serif;background:radial-gradient(900px 420px at 100% -120px,rgba(63,212,148,.26),rgba(63,212,148,0) 62%) no-repeat,#F4F6F5!important;color:#111111!important}
  .card{background:#FFFFFF!important;border:1px solid #E3E7E5!important;box-shadow:0 14px 40px rgba(17,17,17,.07)!important}
  .brand .kicker{color:#7A7F7D!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;font-size:14px!important}
  .brand h1{font-family:'Archivo',Georgia,serif!important;font-weight:800!important;color:#111111!important}
  .brand h1 span{color:#00A86B!important}
  .brand p,.help,.hint{color:#4A4F4D!important}
  label{color:#4A4F4D!important}
  input{background:#FFFFFF!important;border:1px solid #E3E7E5!important;color:#111111!important}
  input:focus{border-color:#00A86B!important;box-shadow:0 0 0 3px rgba(0,168,107,.12)!important}
  input::placeholder{color:#9AA19E!important}
  button{background:#00A86B!important;color:#FFFFFF!important}
  button:hover{background:#008755!important}
  button:disabled{background:#BFC6C3!important}
  .help a{color:#00A86B!important}
  .baseline{background:#00A86B!important}
  .bad{background:#FFFFFF!important;border-color:#E3E7E5!important;color:#4A4F4D!important}.bad b{color:#111111!important}
  .zc{background:#FFFFFF!important;border-color:#E3E7E5!important}.zc span{color:#4A4F4D!important}.zc a{color:#00A86B!important}
  .zc input{background:#FFFFFF!important;border:2px solid #B9BFBC!important;width:22px!important;padding:0!important}
  .zc input:checked{background:#00A86B!important;border-color:#00A86B!important}
</style>

<style>
/* ===== v50: login with Mark's photo behind it ===== */
body.zl{margin:0;min-height:100vh;min-height:100dvh;background:#0C0F11!important;font-family:'Inter Tight',system-ui,sans-serif!important;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:40vh 16px max(22px,env(safe-area-inset-bottom));box-sizing:border-box;overflow-x:hidden}
.zl-bg{position:fixed;inset:0;z-index:0;background:#0C0F11 url(login-bg.jpg) 70% -3vh/118% auto no-repeat}
.zl-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,15,17,0) 0%,rgba(12,15,17,.05) 40%,rgba(12,15,17,.45) 68%,#0C0F11 92%),radial-gradient(420px 300px at 90% 100%,rgba(63,212,148,.16),rgba(63,212,148,0) 70%)}
body.zl .baseline{display:none!important}
body.zl .card{position:relative;z-index:1;width:100%;max-width:420px;margin:0 0 6px!important;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04)),rgba(14,18,20,.34)!important;-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.16)!important;border-radius:26px!important;padding:26px 22px 22px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.4)!important;color:#D6DCD9}
body.zl .kicker{color:#3FD494!important;font-family:'Inter Tight',sans-serif!important;font-weight:500!important;font-size:14px!important;letter-spacing:0!important;text-transform:none!important}
body.zl h1{font-family:'Archivo',Georgia,serif!important;font-weight:800!important;text-transform:uppercase;color:#FFFFFF!important;font-size:34px!important;line-height:1.02!important;letter-spacing:0!important;margin:6px 0 8px!important}
body.zl h1 span{color:#3FD494!important}
body.zl .brand p{color:#DDE3E0!important;font-size:15px!important;margin:0 0 18px!important}
body.zl label{color:#FFFFFF!important;font-size:13.5px!important;font-weight:600!important;letter-spacing:0!important;text-transform:none!important}
body.zl input{background:rgba(12,15,17,.35)!important;border:1.5px solid rgba(255,255,255,.18)!important;color:#FFFFFF!important;border-radius:14px!important;font-size:16px!important;padding:14px 16px!important}
body.zl input:focus{border-color:#3FD494!important;background:rgba(255,255,255,.09)!important;outline:none;box-shadow:0 0 0 3px rgba(63,212,148,.18)!important}
body.zl button[type=submit]{font-family:'Inter Tight',system-ui,sans-serif!important;background:linear-gradient(180deg,#4BE0A0 0%,#2FC584 100%)!important;color:#0C0F11!important;border:0!important;border-radius:999px!important;font-weight:700!important;font-size:17px!important;min-height:56px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px rgba(0,168,107,.3)!important;transition:transform .15s,filter .15s}

/* v2 (24 Oct 2026): website match */
body.zl h1 span,.brand h1 span{color:#FFFFFF!important}
#joinBtn,#loginBtn,#goBtn{background:#3FD494!important;color:#0C0F11!important;box-shadow:0 0 0 6px rgba(63,212,148,.14),0 12px 32px rgba(63,212,148,.35)!important}
#goBtn:disabled{box-shadow:none!important}

</head>
<body class="zl">
  <div class="zl-bg" aria-hidden="true"></div>
  <div class="card">
    <div class="brand">
      <div class="kicker">Members Only</div>
      <h1>Welcome to<br>Zenith <span>HQ.</span></h1>
      <p>Everything you need, in one place. Log in to get started.</p>
    </div>

    <form id="loginForm">
      <label for="username">Email or username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginBtn" type="submit">Log in</button>
    </form>

    <div class="error" id="errorBox"></div>

    <p class="help">Forgotten your login? Message Mark and he'll sort it.</p>
  </div>
  <div class="baseline"></div>

<script>
  const WORKER = 'https://zenith-fit.mark-5a5.workers.dev';

  function destination() {
    const params = new URLSearchParams(location.search);
    const n = params.get('next') || '';
    // Only ever send people to our own pages, never off site.
    return /^[a-z0-9-]+\.html([?#].*)?$/i.test(n) ? n : 'hq.html';
  }

  // Already logged in? Straight through.
  (async function () {
    const token = localStorage.getItem('zenith_token');
    if (!token) return;
    try {
      const res = await fetch(WORKER + '/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) {
        location.replace(destination());
      } else {
        localStorage.removeItem('zenith_token');
        localStorage.removeItem('zenith_name');
        localStorage.removeItem('zenith_programme');
      }
    } catch (e) { /* offline or worker down, stay on login */ }
  })();

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
      const res = await fetch(WORKER + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem('zenith_token', data.token);
        localStorage.setItem('zenith_name', data.name);
        localStorage.setItem('zenith_programme', data.programme);
        location.replace(destination());
      } else {
        errorBox.textContent = data.error || 'Something went wrong. Try again.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    } catch (err) {
      errorBox.textContent = 'Could not reach the server. Check your connection and try again.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
</script>
</body>
