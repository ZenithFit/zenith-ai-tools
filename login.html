<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith HQ — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #F4F4F2;
    color: #111111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 44px 36px 36px;
    box-shadow: 0 14px 40px rgba(17, 17, 17, 0.07);
  }
  .brand {
    margin-bottom: 36px;
  }
  .brand .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #00A86B;
    margin-bottom: 12px;
  }
  .brand h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #111111;
  }
  .brand h1 span { color: #00A86B; }
  .brand p {
    color: #6B706E;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #8A8F8D;
    margin: 22px 0 8px;
  }
  input {
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    border: 1px solid #E4E6E4;
    background: #FAFAF9;
    color: #111111;
    font-size: 16px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus { border-color: #00A86B; background: #FFFFFF; }
  button {
    width: 100%;
    margin-top: 30px;
    padding: 17px;
    border: none;
    border-radius: 999px;
    background: #00A86B;
    color: #FFFFFF;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #008755; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    display: none;
    margin-top: 18px;
    padding: 13px 16px;
    border-radius: 14px;
    background: #FDF0EF;
    border: 1px solid #F3D2CE;
    color: #B3402F;
    font-size: 14px;
    text-align: center;
  }
  .help {
    margin-top: 26px;
    text-align: center;
    color: #8A8F8D;
    font-size: 13px;
    line-height: 1.6;
  }
  .baseline {
    width: 100%;
    max-width: 420px;
    height: 3px;
    background: #00A86B;
    border-radius: 999px;
    margin-top: 28px;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="kicker">Members Only</div>
      <h1>Welcome to<br>Zenith <span>HQ.</span></h1>
      <p>Everything you need, in one place. Log in to get started.</p>
    </div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginBtn" type="submit">Log in</button>
    </form>

    <div class="error" id="errorBox"></div>

    <p class="help">Forgotten your login? Message Mark and he'll sort it.</p>
  </div>
  <div class="baseline"></div>

<script>
  const WORKER = 'https://zenith-fit.mark-5a5.workers.dev';

  function destination() {
    const params = new URLSearchParams(location.search);
    return params.get('next') || 'index.html';
  }

  // Already logged in? Straight through.
  (async function () {
    const token = localStorage.getItem('zenith_token');
    if (!token) return;
    try {
      const res = await fetch(WORKER + '/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) {
        location.replace(destination());
      } else {
        localStorage.removeItem('zenith_token');
        localStorage.removeItem('zenith_name');
        localStorage.removeItem('zenith_programme');
      }
    } catch (e) { /* offline or worker down — stay on login */ }
  })();

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
      const res = await fetch(WORKER + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem('zenith_token', data.token);
        localStorage.setItem('zenith_name', data.name);
        localStorage.setItem('zenith_programme', data.programme);
        location.replace(destination());
      } else {
        errorBox.textContent = data.error || 'Something went wrong. Try again.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    } catch (err) {
      errorBox.textContent = 'Could not reach the server. Check your connection and try again.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
