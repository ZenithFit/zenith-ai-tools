<h1 class="page">Welcome to <em>HQ.</em></h1>
<p class="page-sub">A quick hello from me, then a 2 minute tour so you know where everything lives.</p>
<div id="wv"></div>
<script>
(function(){
  var V=window.ZF_VIDEOS||{},box=document.getElementById('wv'),html='';
  function frame(url){var u=String(url||'');var y=u.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);var v=u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/|\?h=)?([0-9a-f]+)?/);
    if(y)return 'https://www.youtube.com/embed/'+y[1];if(v)return 'https://player.vimeo.com/video/'+v[1]+(v[2]?'?h='+v[2]:'');return '';}
  [['welcome','Welcome from Mark','Who I am, what HQ is for, and how we&rsquo;re going to do this.'],['tour','How to use HQ','Home, Watch, Tools, Guides and Coaching. Where everything lives.']].forEach(function(x){
    var src=frame(V[x[0]]);
    html+='<div class="vid-card">'+(src?'<div class="vid-frame"><iframe src="'+src+'" title="'+x[1]+'" allow="autoplay; fullscreen; picture-in-picture; clipboard-write" allowfullscreen loading="lazy"></iframe></div>':'<div class="vid-frame" style="display:flex;align-items:center;justify-content:center;color:#9AA3A0;font-size:14px;font-weight:600">Video landing soon</div>')+'<div class="vid-title">'+x[1]+'</div><div class="vid-sub">'+x[2]+'</div></div>';
  });
  box.innerHTML=html;
  if(V.welcome){
    try{localStorage.setItem('zf_welcome_seen','1');}catch(e){}
    var t='';try{t=localStorage.getItem('zenith_token')||'';}catch(e){}
    if(t)fetch(API+'/entries',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({tool:'HQ Welcome Watched',data:{when:Date.now()}})}).catch(function(){});
  }
})();
</script>
