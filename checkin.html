<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Friday Check In | Zenith Fit</title>
<meta name="description" content="Start your check in here. About 3 minutes, mostly one tap.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zenith Fit">
<meta property="og:title" content="Friday Check In">
<meta property="og:description" content="Start your check in here. About 3 minutes, mostly one tap.">
<meta property="og:url" content="https://hq.zenithfit.co.uk/checkin.html">
<meta property="og:image" content="https://hq.zenithfit.co.uk/checkin-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hq.zenithfit.co.uk/checkin-card.jpg">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zenith HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#3FD494;--ink:#111111;--dark:#0C0F11;--card:#15191C;--bg:#F4F6F5;--line:#E1E6E3;--body:#4A524E;--muted:#5A625E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter Tight',system-ui,sans-serif;background:#F4F6F5;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.app{max-width:480px;margin:0 auto;height:100dvh;position:fixed;left:0;right:0;top:0;will-change:transform;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
@media(min-width:520px){.app{box-shadow:0 0 0 1px rgba(12,15,17,.06),0 30px 80px rgba(12,15,17,.12)}}

/* top bar */
.top{flex-shrink:0;background:#000;padding:env(safe-area-inset-top,0px) 18px 0;height:calc(60px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:32px;height:32px;border-radius:8px;display:block}
.brand span{font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;letter-spacing:.2em;color:#fff}
.top-r{font-size:11px;font-weight:600;letter-spacing:.18em;color:#9AA39F;text-decoration:none;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}

/* progress */
.prog{flex-shrink:0;display:none;align-items:center;gap:14px;padding:16px 20px 4px 14px}
.prog.on{display:flex}
.back{width:44px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center}
.track{flex:1;height:3px;border-radius:999px;background:#DDE3E0;overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;background:var(--dark);transition:width .35s ease}
.count{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);min-width:42px;text-align:right}

/* body */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;transition:opacity .3s ease}
.main.out{opacity:0}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;padding:22px 22px 20px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--muted)}
h2{font-family:'Archivo',sans-serif;font-weight:600;font-size:25px;line-height:1.18;letter-spacing:.02em;color:var(--ink);text-transform:uppercase}
.help{font-size:15.5px;line-height:1.55;color:var(--body)}

/* welcome */
.hero{position:relative;flex:1;min-height:560px;overflow:hidden;background:var(--dark)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.hero .shade{position:absolute;left:0;right:0;top:34%;height:44%;background:radial-gradient(ellipse at center,rgba(12,15,17,.55) 0%,rgba(12,15,17,0) 70%)}
.hero .in{position:absolute;left:28px;right:28px;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hero .hi{font-size:11px;font-weight:600;letter-spacing:.24em;color:#C9D1CD}
.hero h1{font-family:'Archivo',sans-serif;font-weight:600;font-size:40px;line-height:1;letter-spacing:.06em;color:#fff}
.hero p{font-size:15px;line-height:1.55;color:rgba(255,255,255,.86);max-width:340px}
.hero .small{font-size:12px;color:rgba(255,255,255,.62)}
.donebox{width:100%;text-align:left;background:rgba(12,15,17,.72);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.donebox .k{font-size:10.5px;font-weight:600;letter-spacing:.2em;color:#9AA39F}
.donebox p{font-size:14.5px;line-height:1.5;color:#fff;max-width:none}
.donebox ol{margin:0;padding-left:18px;color:#fff;font-size:14px;line-height:1.5}

/* buttons */
.glow{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 9px 0 28px;border:none;border-radius:999px;background:linear-gradient(180deg,#62E7AE 0%,#3FD494 55%,#2FC383 100%);color:var(--dark);font-weight:700;font-size:15px;letter-spacing:.1em;box-shadow:0 10px 28px rgba(63,212,148,.42),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,opacity .2s}
.glow:active{transform:scale(.98)}
.glow:disabled{opacity:.35;cursor:default;box-shadow:none}
.glow .arr{width:42px;height:42px;border-radius:999px;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.glow.full{width:100%}
.glow.pulse{animation:pulse 2.8s ease-in-out infinite}
.glow .sheen{position:absolute;top:0;bottom:0;left:0;width:40px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:sheen 3.6s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 10px 28px rgba(63,212,148,.38),inset 0 1px 0 rgba(255,255,255,.5)}50%{box-shadow:0 14px 40px rgba(63,212,148,.62),inset 0 1px 0 rgba(255,255,255,.5)}}
@keyframes sheen{0%{transform:translateX(-160%) skewX(-20deg)}60%,100%{transform:translateX(420%) skewX(-20deg)}}
.plain{height:50px;border:1px solid #D3DAD6;border-radius:999px;background:#fff;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--ink)}
.darkpill{display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:var(--dark);font-size:13px;font-weight:600;letter-spacing:.12em;color:#fff;text-decoration:none}
.bar{flex-shrink:0;display:none;flex-direction:column;gap:10px;padding:12px 22px calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(244,246,245,0) 0%,var(--bg) 30%)}
.bar.on{display:flex}
.hide{display:none!important}

/* tiles */
.grid{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;justify-content:center;min-height:58px;padding:10px 6px;border-radius:14px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px rgba(12,15,17,.04);transition:background .18s,color .18s,box-shadow .18s,border-color .18s;text-align:center}
.tile.list{justify-content:flex-start;min-height:62px;padding:14px 16px;text-align:left}
.tile .t{flex:1;display:flex;flex-direction:column;gap:3px}
.tile .l{font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .s{font-size:13.5px;line-height:1.4;opacity:.75}
.tile.on{background:var(--dark);color:#fff;border-color:var(--g);box-shadow:0 0 0 3px rgba(63,212,148,.22),0 12px 26px rgba(12,15,17,.2)}
.tile .dot{width:12px;height:12px;flex-shrink:0;border-radius:999px;box-shadow:0 0 0 4px rgba(12,15,17,.05)}
.tile .tick{width:24px;height:24px;flex-shrink:0;border-radius:999px;background:var(--g);display:none;align-items:center;justify-content:center}
.tile.list.on .tick{display:flex}

/* promise card */
.pcard{position:relative;overflow:hidden;border-radius:20px;background:var(--dark);padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 40px rgba(63,212,148,.16)}
.pcard:after{content:"";position:absolute;width:240px;height:240px;right:-120px;bottom:-140px;border-radius:999px;background:radial-gradient(circle,rgba(63,212,148,.32) 0%,rgba(63,212,148,0) 70%);pointer-events:none}
.pcard .k{position:relative;font-size:11px;font-weight:600;letter-spacing:.2em;color:#9AA39F}
.pcard p{position:relative;font-size:19px;font-weight:500;line-height:1.4;color:#fff}

/* inputs */
.field{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
.field input,.field textarea{width:100%;border:1px solid #DDE3E0;border-radius:14px;background:#fff;padding:0 16px;height:54px;font-family:inherit;font-size:16px;font-weight:400;letter-spacing:0;color:var(--ink)}
textarea,input{direction:ltr;unicode-bidi:normal}
textarea.big{min-height:180px;font-size:16px;height:auto;resize:none;border-radius:18px;padding:18px;line-height:1.55;box-shadow:0 10px 30px rgba(12,15,17,.04)}
.field input::placeholder,textarea::placeholder{color:#9AA19E}
.warn{font-size:13px;color:#B3261E;display:none}
.warn.on{display:block}
.note{background:var(--dark);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 36px rgba(63,212,148,.16)}
.note p{font-size:14.5px;line-height:1.5;color:#D5DBD8}
.note a{align-self:flex-start;display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:13px;font-weight:600;letter-spacing:.06em;color:#fff;text-decoration:none}

/* slider */
.scard{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:20px;box-shadow:0 10px 30px rgba(12,15,17,.05)}
.sval{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sval .n{display:flex;align-items:baseline;gap:6px}
.sval .num{font-family:'Archivo',sans-serif;font-weight:600;font-size:40px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.sval .num.idle{color:#C6CDCA;font-size:26px}
.sval .u{font-size:15px;font-weight:500;color:var(--muted)}
.sval .w{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--dark);color:#fff;font-size:11px;font-weight:600;letter-spacing:.16em;transition:background .2s}
.sval .w:empty{display:none}
.ticks{display:flex;justify-content:space-between;padding:0 6px;margin-top:-8px}
.ticks span{width:20px;text-align:center;font-size:12px;font-weight:600;color:#B4BBB8;font-variant-numeric:tabular-nums;transition:color .15s}
.ticks span.on{color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;outline:none;background:#E6EBE8;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;border-radius:999px;background:#fff;border:3px solid var(--g);box-shadow:0 0 0 6px rgba(63,212,148,.18),0 6px 16px rgba(12,15,17,.18);cursor:pointer}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:999px;background:#fff;border:3px solid var(--g);box-shadow:0 0 0 1px rgba(12,15,17,.12),0 6px 18px rgba(63,212,148,.55);cursor:pointer}
input[type=range]::-moz-range-track{background:transparent}
.ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--muted)}

/* done */
.dcard{position:relative;overflow:hidden;border-radius:24px;background:var(--dark);padding:28px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(63,212,148,.2)}
.dcard:before{content:"";position:absolute;width:300px;height:300px;left:-130px;top:-170px;border-radius:999px;background:radial-gradient(circle,rgba(63,212,148,.4) 0%,rgba(63,212,148,0) 70%);pointer-events:none}
.dcard .ok{position:relative;width:46px;height:46px;border-radius:999px;border:1.5px solid var(--g);display:flex;align-items:center;justify-content:center}
.dcard h2{position:relative;color:#fff;font-size:28px;letter-spacing:.04em}
.dcard p{position:relative;font-size:15.5px;line-height:1.55;color:#D5DBD8}
.wcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:10px}
.who img{width:34px;height:34px;border-radius:9px;display:block}
.who b{display:block;font-size:14.5px;color:var(--ink)}
.who span{font-size:12.5px;color:var(--muted)}
.strip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:12.5px;font-weight:600;line-height:1.4;color:var(--body)}
.reply{font-size:15.5px;line-height:1.6;color:var(--ink);white-space:pre-line}
.ovw{font-size:15.5px;line-height:1.6;color:var(--ink)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.acts .k{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--muted)}
.act{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px 14px}
.act i{font-style:normal;width:26px;height:26px;flex-shrink:0;border-radius:999px;background:var(--dark);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.act span{font-size:15px;line-height:1.5;color:var(--ink);padding-top:2px}
.loading{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted)}
.lcard{position:relative;overflow:hidden;background:var(--dark);border-radius:24px;padding:34px 24px 28px;display:flex;flex-direction:column;align-items:center;gap:22px;box-shadow:0 20px 50px rgba(63,212,148,.22);transition:opacity .35s}
.lcard:before{content:"";position:absolute;width:320px;height:320px;top:-150px;border-radius:999px;background:radial-gradient(circle,rgba(63,212,148,.35) 0%,rgba(63,212,148,0) 70%);pointer-events:none}
.lring{position:relative;width:92px;height:92px;display:flex;align-items:center;justify-content:center}
.lring:before{content:"";position:absolute;inset:0;border-radius:999px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--g);animation:spin 1s linear infinite}
.lring img{width:54px;height:54px;border-radius:14px;animation:lpulse 2s ease-in-out infinite}
.lk{position:relative;font-size:11px;font-weight:600;letter-spacing:.2em;color:#9AA39F;text-align:center}
.lmsg{position:relative;height:26px;width:100%;font-family:'Archivo',sans-serif;font-weight:600;font-size:20px;color:#fff}
.lmsg span{position:absolute;left:0;right:0;text-align:center;opacity:0;animation:lcyc 7.5s infinite}
.lmsg span:nth-child(2){animation-delay:2.5s}.lmsg span:nth-child(3){animation-delay:5s}
.lnote{position:relative;font-size:13px;color:rgba(255,255,255,.6);text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(63,212,148,.45)}50%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(63,212,148,0)}}
@keyframes lcyc{0%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-6px)}}
.wcard.wait{display:none}
.wcard.show{animation:rin .45s ease both}
@keyframes rin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading i{width:8px;height:8px;border-radius:999px;background:var(--g);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.pcard2{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.pcard2 p{font-size:16.5px;font-weight:500;line-height:1.45;color:var(--ink)}
.after{padding:0 4px;font-size:14.5px;line-height:1.55;color:var(--body)}
.err{font-size:14px;color:#B3261E;display:none;text-align:center}
.err.on{display:block}
.plain.picked{background:var(--dark);color:#fff;border-color:var(--g);box-shadow:0 0 0 3px rgba(63,212,148,.22)}
.screen>.plain{margin-top:4px}
.tile.tl.on{background:linear-gradient(120deg,rgba(var(--c),.2) 0%,rgba(var(--c),.07) 55%,#fff 100%);color:var(--ink);border-color:rgba(var(--c),.9);box-shadow:0 0 0 3px rgba(var(--c),.16),0 10px 30px rgba(var(--c),.32);animation:tlglow .6s ease}
.tile.tl.on .dot{box-shadow:0 0 0 4px rgba(var(--c),.22),0 0 14px rgba(var(--c),.9)}
.tile.tl.on .s{opacity:.85}
.tile.tl .tick{background:rgb(var(--c))}
.tile.tl-red .tick svg{stroke:#fff}
@keyframes tlglow{from{box-shadow:0 0 0 0 rgba(var(--c),0),0 0 0 rgba(var(--c),0);background-color:#fff}}
.talk{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.talk .ico{width:44px;height:44px;flex-shrink:0;border-radius:999px;background:var(--dark);display:flex;align-items:center;justify-content:center}
.talk b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:2px}
.talk span{display:block;font-size:13.5px;line-height:1.45;color:var(--body)}
.screen.last textarea.big{min-height:120px}
.app.kb .talk{padding:10px 12px}
.app.kb .talk .ico{width:34px;height:34px}
.restart{background:none;border:none;font-size:13px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.75);text-decoration:underline;text-underline-offset:3px;padding:6px 10px;min-height:44px}
.streak{position:relative;overflow:hidden;border-radius:20px;background:var(--dark);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 36px rgba(63,212,148,.18)}
.streak:after{content:"";position:absolute;width:220px;height:220px;right:-110px;top:-120px;border-radius:999px;background:radial-gradient(circle,rgba(63,212,148,.3) 0%,rgba(63,212,148,0) 70%);pointer-events:none}
.streak .row{position:relative;display:flex;align-items:center;gap:16px}
.streak .big{font-family:'Archivo',sans-serif;font-weight:600;font-size:48px;line-height:1;color:#fff;min-width:44px;text-align:center}
.streak b{display:block;font-size:11px;font-weight:600;letter-spacing:.2em;color:#9AA39F;margin-bottom:4px}
.streak .msg{font-size:15px;line-height:1.45;color:#fff}
.streak .dots{position:relative;display:flex;gap:8px;align-items:center}
.streak .d{width:12px;height:12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35)}
.streak .d.k{background:#fff;border-color:#fff}
.streak .d.now{box-shadow:0 0 0 4px rgba(255,255,255,.16)}
.app.kb textarea.big{min-height:110px}
.app.kb .help{font-size:14.5px}
.app.kb .screen{padding-top:14px;gap:12px}
.app.kb .bar{padding-bottom:10px}
.app.kb #submitWrap>*:not(#submit):not(#err){display:none!important}
.app.kb .screen .talk{display:none}
.app.kb .screen h2{font-size:21px}

/* v2 additions */
.sub{font-size:13px;line-height:1.45;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--ink);text-align:left;transition:transform .12s ease}
.chip:active,.rb:active{transform:scale(.96)}
.chip.on{background:var(--dark);color:#fff;border-color:var(--g);box-shadow:0 0 0 3px rgba(63,212,148,.22)}
.trio{display:flex;flex-direction:column;gap:12px}
.trow{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.trow b{font-size:14.5px;color:var(--ink)}
.trow b span{font-weight:500;color:var(--muted)}
.r8{display:grid;gap:6px}
.rb{min-height:44px;padding:4px 2px;border-radius:12px;border:1px solid var(--line);background:#F8FAF9;font-size:14.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;transition:transform .12s ease}
.rb.on{background:var(--dark);color:#fff;border-color:var(--g);box-shadow:0 0 0 3px rgba(63,212,148,.2)}
.conf{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.conf b{font-size:14.5px;color:var(--ink)}
.conf .rb{font-size:14px}
textarea.big.sm{min-height:110px}
.ttl{font-family:'Archivo',sans-serif;font-weight:600;font-size:20px;line-height:1.15;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.reply b{font-weight:700}
.res{display:flex;gap:14px;align-items:center;background:var(--dark);border-radius:18px;padding:14px;color:#fff;text-decoration:none}
.res .th{width:58px;height:58px;border-radius:14px;background:#1B3D30;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.08em;color:#3FD494;text-align:center}
.res .rt{display:flex;flex-direction:column;gap:2px}
.res b{font-size:15px}
.res .rt span{font-size:13px;color:#BFC6C3}
#after{display:flex;flex-direction:column;gap:14px}
.app.kb textarea.big.sm{min-height:84px}
.app.kb .chips{display:none}
.lbig{position:relative;font-family:'Archivo',sans-serif;font-weight:600;font-size:24px;line-height:1.2;color:#fff;text-align:center}
.lbig span{color:#3FD494;font-variant-numeric:tabular-nums}
.lcard .lmsg{font-family:'Inter Tight',sans-serif;font-weight:500;font-size:15px;color:rgba(255,255,255,.75);height:22px}
.waitnote{font-size:13px;line-height:1.45;color:var(--muted);text-align:center}
.bar{transition:opacity .22s ease}
.app.swap .main,.app.swap .bar{opacity:0!important;transition:opacity .1s ease}
.lfact{position:relative;width:100%;border-top:1px solid rgba(255,255,255,.14);padding-top:18px;display:flex;flex-direction:column;gap:8px;text-align:center}
.lfact .k{font-size:10.5px;font-weight:600;letter-spacing:.2em;color:#3FD494}
.lfact p{font-size:16.5px;line-height:1.5;color:#fff;font-weight:500}
.lcard{gap:16px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="brand" href="hq.html" aria-label="Zenith HQ"><img src="zf-logo.png" alt=""><span>ZENITH FIT</span></a>
    <a class="top-r" id="toBack" href="hq.html">BACK</a>
  </div>
  <div class="prog" id="prog">
    <button class="back" id="back" type="button" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count"></span>
  </div>
  <main class="main" id="main"></main>
  <div class="bar" id="bar">
    <button class="plain hide" id="skip" type="button">NOTHING THIS WEEK</button>
    <button class="glow full" id="next" type="button">NEXT<span class="arr" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3FD494" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span></button>
    <div id="submitWrap" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <button class="glow full" id="submit" type="button">SEND MY CHECK IN<span class="arr" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3FD494" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span></button>
      <div class="waitnote">Then hang around for 20 seconds and you'll get your instant feedback.</div>
      <div class="err" id="err"></div>
    </div>
    <a class="darkpill hide" id="home" href="hq.html">BACK TO HQ</a>
  </div>
</div>

<script>
const API='https://zenith-fit.mark-5a5.workers.dev';
const SHEETS_URL='https://script.google.com/macros/s/AKfycbxt7ov_pKLeyjg8p-VnFXE4ewsAH7U8HKm8RVnXU3WBbJuaUU3zssefBmlUjProH1HO/exec';
const TOOL='Friday Check In';
const LASTKEY='zf_checkin_last';
const WHOKEY='zf_checkin_who';
const ARROW='<span class="arr" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3FD494" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>';

// ---------- who is it: HQ login used silently if it's there, never required ----------
let auth='no',authToken='',authName='';
try{authToken=localStorage.getItem('zenith_token')||'';authName=localStorage.getItem('zenith_name')||'';if(authToken&&authName)auth='maybe';}catch(e){}

const params=new URLSearchParams(location.search);
const TEST=params.has('test');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clean(s){return (s||'').trim().replace(/\s+/g,' ');}
function nameOk(s){return clean(s).split(' ').filter(p=>p.length>=2).length>=2;}
function emailOk(s){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(clean(s));}
function first(s){return clean(s).split(' ')[0]||'';}
function isOpen(){const d=new Date().getDay();return d===4||d===5||d===6||d===0;}
function weekKey(){const d=new Date();const day=d.getDay();const shift=day===5?0:day===6?-1:day===0?-2:5-day;d.setDate(d.getDate()+shift);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function stamp(){return new Date().toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}
function late(){const d=new Date(),day=d.getDay();return (day===5&&d.getHours()>=15)||day===6||day===0;}

// ---------- answers (v2, Nov 2026) ----------
const A={name:'',email:'',lastPromise:'',lastQuestion:'',planned:null,stepTarget:null,
  proud:'',promise:'',blockers:[],blockerText:'',sessions:'',steps:'',food:'',foodQ:'',water:'',
  lastWeekend:'',railsWhy:[],weekendText:'',sleep:'',energy:'',stress:'',light:'',going:'',
  moment:'',instead:'',lastq:'',on:[],trip:'',next:'',when:'',sure:null,need:''};
const MULTI={blockers:1,railsWhy:1,on:1};
let known=false;
try{const w=JSON.parse(localStorage.getItem(WHOKEY)||'null');if(w&&w.name&&w.email){A.name=w.name;A.email=w.email;known=true;}}catch(e){}
const HISTKEY='zf_checkin_hist';
let localHist=[];
try{localHist=JSON.parse(localStorage.getItem(HISTKEY)||'[]')||[];}catch(e){localHist=[];}
function prevWeekKey(){const p=weekKey().split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()-7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
try{const l=JSON.parse(localStorage.getItem(LASTKEY)||'null');if(l&&l.next&&l.week!==weekKey()){A.lastPromise=l.next;if(l.question&&l.week===prevWeekKey())A.lastQuestion=l.question;}}catch(e){}
// Test links: ?test=1 shows every screen with a sample promise and question. ?test=2 is someone with nothing on file.
if(TEST){
  const none=params.get('test')==='2';
  A.lastPromise=none?'':'Pre log my food every night';
  A.lastQuestion=none?'':"When last weekend went off track, what was the first thing that slipped, before the food?";
  A.planned=3;A.stepTarget=8000;
}
const DRAFTKEY='zf_checkin_draft2';
let draft=null;
try{const dr=JSON.parse(localStorage.getItem(DRAFTKEY)||'null');if(dr&&dr.week===weekKey()&&dr.screen&&dr.a)draft=dr;else localStorage.removeItem(DRAFTKEY);}catch(e){}
let doneThis=TEST?null:(localHist.find(h=>h&&h.week===weekKey())||null);
let pastWeeks=localHist.filter(h=>h&&h.week&&h.week!==weekKey()).sort((x,y)=>String(y.week).localeCompare(String(x.week)));

const SECTION={proud:'FIRST UP',promise:"LAST WEEK'S PROMISE",blocker:"LAST WEEK'S PROMISE",numbers:'THE NUMBERS',weekend:'THE NUMBERS',rails:'THE NUMBERS',loose:'THE NUMBERS',feel:'THE NUMBERS',
  light:'THE HONEST BIT',going:'THE HONEST BIT',moment:'THE HONEST BIT',lastq:'THE HONEST BIT',ahead:'LOOKING AHEAD',next:'LOOKING AHEAD',need:'LAST ONE'};
const SKIP={moment:"NOTHING I'D CHANGE",lastq:'SKIP THIS ONE'};
const STEPS=['Under 4,000','4,000 to 6,000','6,000 to 8,000','8,000 to 10,000','10,000 to 12,000','Over 12,000'];

function order(){
  const o=['welcome'];
  if(auth==='no'&&!known)o.push('who');
  o.push('proud','promise');
  if(A.promise==='Partly'||A.promise==='No')o.push('blocker');
  o.push('numbers','weekend');
  if(A.lastWeekend==='Off the rails')o.push('rails');
  if(A.lastWeekend==='A bit loose')o.push('loose');
  o.push('feel','light','going','moment');
  if(A.lastQuestion)o.push('lastq');
  o.push('ahead','next','need','done');
  return o;
}
let screen='welcome';
let submitted=false;

const $=id=>document.getElementById(id);
const main=$('main');
const app=document.querySelector('.app');

// While typing, keep the page sat exactly above the keyboard. The moment typing stops, snap back to full screen.
function typing(){const a=document.activeElement;return !!(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='range')));}
// iPhone only. Android resizes the page for the keyboard itself, and moving the page about while someone types can scramble their typing.
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function reset(){if(!IOS)return;if(app.style.height)app.style.height='';if(app.style.transform)app.style.transform='';if(app.classList.contains('kb'))app.classList.remove('kb');if(window.scrollY)window.scrollTo(0,0);}
function fit(){
  if(!IOS)return;
  const vv=window.visualViewport;
  if(!vv||!typing()||vv.height>window.innerHeight*0.85){reset();return;}
  const hh=vv.height+'px',tt='translateY('+vv.offsetTop+'px)',was=app.classList.contains('kb');
  if(app.style.height!==hh)app.style.height=hh;
  if(app.style.transform!==tt)app.style.transform=tt;
  if(!was){app.classList.add('kb');const a=document.activeElement;setTimeout(()=>a&&a.scrollIntoView&&a.scrollIntoView({block:'nearest'}),50);}
}
document.addEventListener('focusout',()=>{[0,120,350,700].forEach(t=>setTimeout(()=>{if(!typing())reset();else fit();},t));});
document.addEventListener('focusin',()=>{[60,300].forEach(t=>setTimeout(fit,t));});
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit);}
window.addEventListener('scroll',()=>{if(IOS&&window.scrollY)window.scrollTo(0,0);});
// Tap anywhere that isn't a box to put the keyboard away
main.addEventListener('pointerdown',e=>{const t=e.target;if(!t.closest('input,textarea,label')){const a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'))a.blur();}});
function dropKeyboard(){const a=document.activeElement;if(a&&a.blur)a.blur();}
// Tapping anything in the bottom bar puts the keyboard away first, so the consent tick reappears
let autoTap=0;
document.getElementById('bar').addEventListener('pointerdown',e=>{
  if(!typing())return;
  // v2: NEXT works on the first tap with the keyboard up. We put the keyboard away and press the button for them,
  // because the page moves as the keyboard closes and the phone would otherwise lose the tap.
  // v3: fade the screen out first, then drop the keyboard while nothing's showing, then bring the next screen in.
  // That way nobody sees the page jump about as the keyboard closes.
  const b=e.target.closest&&e.target.closest('#next,#skip');
  app.classList.add('swap');
  setTimeout(dropKeyboard,110);
  if(b&&!b.disabled){autoTap=Date.now();setTimeout(()=>b.click(),430);}
  else setTimeout(()=>app.classList.remove('swap'),480);
},true);
document.getElementById('bar').addEventListener('click',e=>{if(e.isTrusted&&Date.now()-autoTap<1300){e.stopPropagation();e.preventDefault();}},true);

function questions(){return order().filter(x=>x!=='welcome'&&x!=='who'&&x!=='done');}

let moving=false;
function go(dir){
  if(moving)return;
  const o=order();
  let i=o.indexOf(screen);if(i<0)i=0;
  let n=Math.min(o.length-1,Math.max(0,i+dir));
  if(o[n]==='done'&&!submitted)return;
  if(o[n]===screen)return;
  moving=true;
  main.classList.add('out');
  const hidden=app.classList.contains('swap');
  setTimeout(()=>{screen=o[n];render();main.scrollTop=0;requestAnimationFrame(()=>requestAnimationFrame(()=>{main.classList.remove("out");app.classList.remove('swap');moving=false;}));},hidden?30:300);
}

function canNext(){
  switch(screen){
    case 'who':return nameOk(A.name)&&emailOk(A.email);
    case 'proud':return clean(A.proud).length>1;
    case 'promise':return !!A.promise;
    case 'blocker':return A.blockers.length>0;
    case 'numbers':return A.sessions!==''&&A.steps!==''&&A.food!==''&&!!A.foodQ;
    case 'weekend':return !!A.lastWeekend;
    case 'rails':return A.railsWhy.length>0;
    case 'feel':return !!(A.sleep&&A.energy&&A.stress&&A.water);
    case 'light':return !!A.light;
    case 'going':return !!A.going;
    case 'ahead':return A.on.length>0;
    case 'next':return clean(A.next).length>2&&A.sure!==null;
    default:return true;
  }
}
function saveDraft(){
  if(submitted||screen==='welcome'||screen==='done')return;
  try{localStorage.setItem(DRAFTKEY,JSON.stringify({week:weekKey(),screen:screen,a:A,at:Date.now()}));}catch(e){}
}
function clearDraft(){draft=null;try{localStorage.removeItem(DRAFTKEY);}catch(e){}}
let draftT=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(draftT);saveDraft();}});
function syncBar(){
  clearTimeout(draftT);draftT=setTimeout(saveDraft,400);
  const last=screen==='need';
  $('next').classList.toggle('hide',last||screen==='done');
  $('submitWrap').classList.toggle('hide',!last);
  const sk=SKIP[screen];
  $('skip').classList.toggle('hide',!sk);if(sk&&$('skip').textContent!==sk)$('skip').textContent=sk;
  $('home').classList.toggle('hide',screen!=='done');
  $('next').disabled=!canNext();
  $('submit').disabled=!canNext();
}

// ---------- building blocks ----------
const TICK='<span class="tick" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0C0F11" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
function isOn(k,v){return MULTI[k]?A[k].indexOf(v)>=0:String(A[k])===String(v);}
// big tiles, one answer, moves on by itself
function tiles(k,opts,cols,size){
  return '<div class="grid" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+opts.map(v=>{const on=isOn(k,v);
    return '<button type="button" class="tile'+(on?' on':'')+'" data-k="'+k+'" data-v="'+esc(v)+'" data-auto="1" aria-pressed="'+on+'"><span class="t"><span class="l" style="font-size:'+(size||17)+'px">'+esc(v)+'</span></span></button>';}).join('')+'</div>';
}
// list tiles with a coloured dot and a line of context
function listTiles(k,opts,light){
  const TL={Green:'63,212,148',Amber:'242,179,61',Red:'229,72,77'};
  return '<div class="grid" style="grid-template-columns:minmax(0,1fr)">'+opts.map(op=>{const on=isOn(k,op.l);const tl=light&&TL[op.l];
    return '<button type="button" class="tile list'+(tl?' tl tl-'+op.l.toLowerCase():'')+(on?' on':'')+'"'+(tl?' style="--c:'+tl+'"':'')+' data-k="'+k+'" data-v="'+esc(op.l)+'" data-auto="1" aria-pressed="'+on+'">'+
      '<span class="dot" style="background:'+op.dot+'"></span><span class="t"><span class="l" style="font-size:16px">'+esc(op.l)+'</span><span class="s">'+esc(op.s)+'</span></span>'+TICK+'</button>';}).join('')+'</div>';
}
// chips, tap as many as fit
function chips(k,opts){
  return '<div class="chips">'+opts.map(v=>{const on=isOn(k,v);return '<button type="button" class="chip'+(on?' on':'')+'" data-k="'+k+'" data-v="'+esc(v)+'" aria-pressed="'+on+'">'+esc(v)+'</button>';}).join('')+'</div>';
}
// a row of small buttons inside a card
function row(k,opts,cols){
  return '<div class="r8" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+opts.map(v=>{const on=isOn(k,v);return '<button type="button" class="rb'+(on?' on':'')+'" data-k="'+k+'" data-v="'+esc(v)+'" aria-pressed="'+on+'">'+esc(v)+'</button>';}).join('')+'</div>';
}
function head(title,help){return '<span class="eyebrow">'+SECTION[screen]+'</span><h2>'+esc(title)+'</h2>'+(help?'<p class="help">'+esc(help)+'</p>':'');}
function area(k,ph,small){return '<textarea class="big'+(small?' sm':'')+'" data-t="'+k+'" autocomplete="off" name="zf-'+k+'" aria-label="'+esc(ph)+'" placeholder="'+esc(ph)+'">'+esc(A[k])+'</textarea>';}
function line(k,label,ph){return '<label class="field">'+esc(label)+'<input type="text" data-t="'+k+'" autocomplete="off" name="zf-'+k+'" enterkeyhint="done" placeholder="'+esc(ph)+'" value="'+esc(A[k])+'"></label>';}

function render(){
  const qs=questions();const qi=qs.indexOf(screen);
  $('prog').classList.toggle('on',qi>=0);
  if(qi>=0){$('fill').style.width=Math.round((qi+1)/qs.length*100)+'%';$('count').textContent=(qi+1)+' / '+qs.length;}
  $('bar').classList.toggle('on',screen!=='welcome');
  $('toBack').classList.toggle('hide',!(screen==='welcome'||screen==='done'));
  let h='';

  if(screen==='welcome'){
    const open=isOpen()||TEST;
    const hi=auth!=='no'?'HEY '+esc(first(authName).toUpperCase()):(known?'HEY '+esc(first(A.name).toUpperCase()):'HEY THERE');
    if(doneThis){
      h='<div class="hero"><img src="checkin-hero.jpg" alt=""><div class="shade"></div><div class="in">'+
        '<span class="hi">'+hi+'</span><h1>CHECKED IN</h1>'+
        '<p>You\'ve done your check in for this week. Your next one opens on Thursday.</p>'+
        (doneThis.next?'<div class="donebox"><span class="k">YOUR PROMISE FOR NEXT WEEK</span><p>'+esc(doneThis.next)+'</p></div>':'')+
        '<a class="glow" href="hq.html" style="margin-top:6px;text-decoration:none">BACK TO HQ'+ARROW+'</a>'+
        '<button type="button" id="redo" style="background:none;border:0;color:rgba(255,255,255,.75);font:500 14px Inter Tight,sans-serif;text-decoration:underline;margin-top:14px;padding:8px;cursor:pointer">Something gone wrong? Do it again</button>'+
        '</div></div>';
      main.innerHTML=h;bind();syncBar();
      $('redo').onclick=()=>{doneThis=null;clearDraft();render();};
      $('prog').classList.remove('on');$('bar').classList.remove('on');$('toBack').classList.remove('hide');
      return;
    }
    h='<div class="hero"><img src="checkin-hero.jpg" alt=""><div class="shade"></div><div class="in">'+
      '<span class="hi">'+hi+'</span><h1>CHECK IN</h1>'+
      (open
        ?'<p>This check in is about reflection, ownership, and setting clear direction for the week ahead.</p><p>Be honest with it. That\'s how I can actually help you.</p>'+
         (draft
           ?'<button type="button" class="glow pulse" id="resume" style="margin-top:10px">CONTINUE CHECK IN'+ARROW+'<span class="sheen" aria-hidden="true"></span></button>'+
            '<span class="small">You\'re part way through. Your answers are saved.</span>'+
            '<button type="button" class="restart" id="restart">Start again instead</button>'
           :'<button type="button" class="glow pulse" id="start" style="margin-top:10px">START CHECK IN'+ARROW+'<span class="sheen" aria-hidden="true"></span></button>'+
            '<span class="small">About 3 minutes. Mostly one tap. Due by 3pm Friday.</span>'+
            (TEST?'<span class="small">TEST MODE. Nothing here counts as a real check in.</span>':'')+
            (auth==='no'&&known?'<button type="button" class="restart" id="notme">Not '+esc(first(A.name))+'? Tap here</button>':''))
        :'<p>Your check in opens on Thursday morning and stays open until Sunday night.</p><p>In the meantime, keep logging, keep moving, and keep the promise you made yourself.</p>'+
         '<a class="glow" href="hq.html" style="margin-top:10px;text-decoration:none">BACK TO HQ'+ARROW+'</a>')+
      '</div></div>';
  }
  else if(screen==='who'){
    h='<div class="screen"><span class="eyebrow">FIRST THINGS FIRST</span><h2>Who\'s checking in?</h2>'+
      '<p class="help">Use the same email you use for the Zenith Fit app so I know it\'s you.</p>'+
      '<label class="field">Full name<input type="text" id="f-name" autocomplete="name" enterkeyhint="next" placeholder="Joe Bloggs" value="'+esc(A.name)+'"></label>'+
      '<label class="field">Email<input type="email" id="f-email" autocomplete="email" inputmode="email" enterkeyhint="done" placeholder="joe@example.com" value="'+esc(A.email)+'"></label>'+
      '<div class="warn" id="who-warn">First and last name, and the email you use with Mark, please.</div>'+
      '<div class="note"><p>You\'ll only need to do this once. Next week it remembers you, and last week\'s promise is filled in for you.</p></div></div>';
  }
  else if(screen==='proud'){
    h='<div class="screen">'+head('What are you most proud of this week?','Big or small. Something you did, not a number.')+talkCard()+area('proud','Got my session done even though...')+'</div>';
  }
  else if(screen==='promise'){
    h='<div class="screen"><span class="eyebrow">'+SECTION.promise+'</span>'+
      (A.lastPromise?'<div class="pcard"><span class="k">YOU PROMISED</span><p>'+esc(A.lastPromise)+'</p></div>':'')+
      '<h2>Did you keep your promise from last week?</h2>'+
      tiles('promise',['Yes','Partly','No'],3,17)+
      (A.lastPromise
        ?'<p class="sub">Partly and No are fine answers. They tell us where to look.</p>'
        :'<button type="button" class="tile'+(A.promise==="Can't remember"?' on':'')+'" data-k="promise" data-v="Can\'t remember" data-auto="1"><span class="t"><span class="l" style="font-size:16px">I can\'t remember</span></span></button>'+
         '<p class="sub">No problem if you can\'t. We\'ll set a fresh one at the end.</p>')+
      '</div>';
  }
  else if(screen==='blocker'){
    h='<div class="screen">'+head('What got in the way?',"I'm not going to judge. Tell me exactly what got in the way, then give me some more context below.")+

// ---------- something to read while the feedback is written. One line per wait, never the same one twice running. ----------
const WAITLINES=["One bad meal doesn't ruin the week. It's 1 meal out of about 21. The next one puts you straight back on plan.", "The scales going up overnight doesn't mean body fat. It's far more likely to be water, salt and food still in your system.", "You can eat carbs after 6pm. Your body doesn't own a clock. What you eat across the whole week is what counts.", "You don't need to feel motivated to start. Motivation turns up after you've started.", "A 20 minute session still counts. Something beats nothing, every single time.", "Lifting weights won't make you bulky. It makes you stronger, and it keeps hold of your muscle while the fat comes off.", "You can't burn off a bad day with extra cardio. Get back to your normal plan at the next meal.", "No food is off limits. 80% of the time we eat for the goal, 20% of the time we eat for life.", "Sit ups won't shift fat from your stomach. You can't choose where it comes off. Keep doing the basics and it comes off everywhere.", "Being sore the next day doesn't tell you it was a good session. Turning up again does.", "Your steps count as much as your sessions. A walk every day does more than most people think.", "A slow week is still a week in the right direction. Fat loss never moves in a straight line.", "This works on consistent, average weeks. Perfect weeks were never part of the plan.", "Poor sleep makes you hungrier the next day. Getting to bed on time is part of the plan.", "Missing 1 session changes nothing. Missing the next one is where it starts. Never miss twice.", "Fat loss still works through the menopause. Strength training, protein, steps and sleep matter more than ever.", "Plan your food the night before and tomorrow gets a lot easier. Most bad days were never planned.", "The weekend is 2 days out of 7. That's nearly a third of your week, so it gets a plan too.", "You don't need to earn your food with exercise. Food is fuel, and training is for getting stronger.", "The scales are one measure. Your clothes, your photos, your energy and your strength count too."];
function waitLine(){let last=-1;try{last=parseInt(localStorage.getItem('zf_checkin_waitline'),10);}catch(e){}let i=Math.floor(Math.random()*WAITLINES.length);if(i===last)i=(i+1)%WAITLINES.length;try{localStorage.setItem('zf_checkin_waitline',String(i));}catch(e){}return WAITLINES[i];}

function runs(){
  // history is newest first, one per week, this week excluded
  const kept=A.promise==='Yes'||A.promise==='Partly';
  let streak=0,noRun=0;
  if(kept){streak=1;for(const h of pastWeeks){if(h.promiseKept==='Yes'||h.promiseKept==='Partly')streak++;else break;}}
  if(A.promise==='No'){noRun=1;for(const h of pastWeeks){if(h.promiseKept==='No')noRun++;else break;}}
  return {kept,streak,noRun};
}
function streakCard(){
  const r=runs();if(!r.kept)return '';
  const past=pastWeeks.slice(0,6).reverse().map(h=>'<span class="d'+(h.promiseKept==='Yes'||h.promiseKept==='Partly'?' k':'')+'"></span>').join('');
  const msg=r.streak===1?"You did what you said you'd do. That's exactly how the trust in yourself gets rebuilt.":"That's "+r.streak+" weeks in a row you've done what you said you'd do. Keep building.";
  return '<div class="streak"><div class="row"><span class="big">'+r.streak+'</span><div><b>'+(r.streak===1?'PROMISE KEPT':'PROMISES KEPT IN A ROW')+'</b><span class="msg">'+msg+'</span></div></div>'+
    '<div class="dots" aria-hidden="true">'+past+'<span class="d k now"></span></div></div>';
}

  const rs=$('resume');if(rs)rs.onclick=()=>{
    const keep={lastPromise:A.lastPromise,lastQuestion:A.lastQuestion,planned:A.planned,stepTarget:A.stepTarget,name:A.name,email:A.email};
    Object.assign(A,draft.a);

// ---------- the instant feedback, written by the Worker with their history ----------
function fmtReply(t){return esc(t).replace(/^(\d\. [^\n]{2,40})$/gm,'<b>$1</b>');}
async function askFeedback(entry){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),60000);
  try{
    const headers={'Content-Type':'application/json'};
    if(auth!=='no'&&authToken)headers.Authorization='Bearer '+authToken;
    const r=await fetch(API+'/checkin/reply',{method:'POST',signal:ctl.signal,headers,body:JSON.stringify({name:auth==='no'?A.name:clean(authName),email:A.email||'',data:entry})});
    const d=await r.json();
    if(!r.ok||d.error||!d.reply)throw new Error(d.error||'No reply');
    return d;
  }finally{clearTimeout(t);}
}

function logToSheets(fields,message,tool){
  const payload={tool:tool||TOOL,message:(window.ZFC?ZFC.stamp(message):message),...fields};
  fetch(SHEETS_URL,{method:'POST',mode:'no-cors',keepalive:true,body:JSON.stringify(payload)}).catch(()=>{});
}

// ---------- what the Worker knows before they start: sessions planned, step target, last promise and question ----------
async function loadStart(){
  try{
    const headers={'Content-Type':'application/json'};
    if(auth!=='no'&&authToken)headers.Authorization='Bearer '+authToken;
    else if(!emailOk(A.email))return;
    const r=await fetch(API+'/checkin/start',{method:'POST',headers,body:JSON.stringify({week:weekKey(),name:A.name,email:A.email})});
    if(!r.ok)return;
    const d=await r.json();if(!d||!d.matched)return;
    if(TEST)return;
    if(d.planned)A.planned=d.planned;
    if(d.stepTarget)A.stepTarget=d.stepTarget;
    if(typeof d.lastPromise==='string'&&d.lastPromise)A.lastPromise=d.lastPromise;
    if(typeof d.lastQuestion==='string')A.lastQuestion=d.lastQuestion;
    if(screen==='welcome'||screen==='promise'||screen==='numbers')render();
  }catch(e){}
}

// ---------- silent login check, the page works the same without it ----------
async function initSession(){
  if(auth==='no'){loadStart();return;}
  try{
    const r=await fetch(API+'/entries?tool='+encodeURIComponent(TOOL)+'&limit=12',{headers:{'Authorization':'Bearer '+authToken}});
    if(r.status===401){
      try{localStorage.removeItem('zenith_token');localStorage.removeItem('zenith_name');localStorage.removeItem('zenith_programme');}catch(e){}
      auth='no';authToken='';if(screen==='welcome')render();loadStart();return;
    }
    if(!r.ok)return;
    const d=await r.json();auth='yes';if(d.name)authName=d.name;
    const wk=weekKey();
    const all=(d.entries||[]).map(e=>e.data).filter(en=>en&&en.week&&!en.test);
    all.sort((x,y)=>String(y.submitted||y.week).localeCompare(String(x.submitted||x.week)));
    const seen={};pastWeeks=all.filter(en=>{if(en.week===wk||seen[en.week])return false;seen[en.week]=1;return true;});
    const mine=all.find(en=>en.week===wk);
    if(mine&&!TEST&&!submitted&&!doneThis){doneThis={week:wk,next:mine.next,actions:[]};}
    const prev=pastWeeks.find(en=>en.next);
    if(prev&&!A.lastPromise&&!TEST){A.lastPromise=prev.next;}
    if(screen==='welcome')render();
    loadStart();
  }catch(e){}
}

render();
initSession();

</script>
